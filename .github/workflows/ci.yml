name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run certify:field
      - run: npm run build
        id: build
      - run: npm audit --audit-level=high
      - name: Configure Electron sandbox
        id: sandbox
        run: |
          node node_modules/electron/install.js
          sudo chown root:root node_modules/electron/dist/chrome-sandbox
          sudo chmod 4755 node_modules/electron/dist/chrome-sandbox
      - run: xvfb-run -a npm run test:smoke:built
      - name: Verify update quit lifecycle
        run: xvfb-run -a node scripts/verify-update-quit.mjs
      - name: Verify LabVIEW project UI
        run: xvfb-run -a node scripts/verify-labview-project-ui.mjs
        env:
          BORDEAUX_LABVIEW_UI_OUTPUT: .ui-artifacts/labview
      - name: Verify project folder UI
        run: xvfb-run -a node scripts/verify-project-folder-ui.mjs
        env:
          BORDEAUX_PROJECT_UI_OUTPUT: .ui-artifacts/project
          ELECTRON_DISABLE_SECURITY_WARNINGS: "true"
      - name: Verify library and routine UI
        run: xvfb-run -a node scripts/verify-library-ui.mjs
        env:
          BORDEAUX_LIBRARY_UI_OUTPUT: .ui-artifacts/library
      - name: Verify planning recovery and Zone editing
        run: |
          xvfb-run -a node scripts/verify-planning-recovery-ui.mjs
          xvfb-run -a node scripts/verify-range-limits-ui.mjs
      - name: Verify shared interface controls
        if: ${{ !cancelled() && steps.build.outcome == 'success' && steps.sandbox.outcome == 'success' }}
        run: xvfb-run -a node scripts/verify-interface-ui.mjs
        env:
          BORDEAUX_INTERFACE_UI_OUTPUT: .ui-artifacts/interface
      - name: Verify interface workflows
        if: ${{ !cancelled() && steps.build.outcome == 'success' && steps.sandbox.outcome == 'success' }}
        run: xvfb-run -a node scripts/verify-interface-workflows.mjs
        env:
          BORDEAUX_INTERFACE_WORKFLOWS_OUTPUT: .ui-artifacts/interface-workflows
      - name: Verify command output branches
        if: ${{ !cancelled() && steps.build.outcome == 'success' && steps.sandbox.outcome == 'success' }}
        run: xvfb-run -a node scripts/verify-command-branches-ui.mjs
        env:
          BORDEAUX_BRANCH_UI_OUTPUT: .ui-artifacts/command-branches
      - name: Verify routine workspace
        if: ${{ !cancelled() && steps.build.outcome == 'success' && steps.sandbox.outcome == 'success' }}
        run: xvfb-run -a node scripts/verify-routine-workspace-ui.mjs
        env:
          BORDEAUX_ROUTINE_UI_OUTPUT: .ui-artifacts/routine-workspace
      - name: Verify optimizer UI
        if: ${{ !cancelled() && steps.build.outcome == 'success' && steps.sandbox.outcome == 'success' }}
        run: xvfb-run -a node scripts/verify-optimizer-ui.mjs
        env:
          BORDEAUX_OPTIMIZER_UI_OUTPUT: .ui-artifacts/optimizer
      - name: Verify mocked robot push UI
        if: ${{ !cancelled() && steps.build.outcome == 'success' && steps.sandbox.outcome == 'success' }}
        run: xvfb-run -a node scripts/verify-robot-push-ui.mjs
        env:
          BORDEAUX_PUSH_UI_OUTPUT: .ui-artifacts/push
      - name: Verify direct SFTP path upload UI
        if: ${{ !cancelled() && steps.build.outcome == 'success' && steps.sandbox.outcome == 'success' }}
        run: xvfb-run -a node scripts/verify-robot-file-push-ui.mjs
        env:
          BORDEAUX_FILE_PUSH_UI_OUTPUT: .ui-artifacts/file-push
      - name: Verify update panel UI
        if: ${{ !cancelled() && steps.build.outcome == 'success' && steps.sandbox.outcome == 'success' }}
        run: xvfb-run -a node scripts/verify-app-updates-ui.mjs
        env:
          BORDEAUX_UPDATES_UI_OUTPUT: .ui-artifacts/updates
      - name: Upload UI evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-verification
          include-hidden-files: true
          path: |
            .ui-artifacts/**/*.png
            .ui-artifacts/**/result*.json
            .ui-artifacts/**/failure-dom.txt
          if-no-files-found: warn
