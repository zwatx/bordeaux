name: Publish production release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: bordeaux-production-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: mac
            os: macos-15
            artifact: bordeaux-macos
          - platform: windows
            os: windows-latest
            artifact: bordeaux-windows
          - platform: linux
            os: ubuntu-latest
            artifact: bordeaux-linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run verify:release-tag
      - run: npm test
      - run: npm run typecheck
      - run: npm run certify:field
        if: matrix.platform == 'linux'
      - name: Require macOS signing and notarization credentials
        if: matrix.platform == 'mac'
        env:
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: node scripts/verify-signing-env.mjs mac
      - name: Use HTTPS/TCP for Apple ticket delivery
        if: matrix.platform == 'mac'
        # Temporary runner workaround: https://github.com/actions/runner-images/issues/14924
        run: |
          printf '%s\n' 'block return out quick proto udp from any to any port 443' | sudo pfctl -f -
          sudo pfctl -E
      - name: Build signed and notarized macOS packages
        if: matrix.platform == 'mac'
        env:
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          npm run package:mac:ci -- --config.mac.notarize=true --config.forceCodeSigning=true --config.publish.channel=latest --config.publish.releaseType=release --config.dmg.sign=true
          node scripts/notarize-release-dmgs.mjs release latest
      - name: Require Windows signing credentials and approved signer
        if: matrix.platform == 'windows'
        env:
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
          WIN_SIGNER_SHA1: ${{ secrets.WIN_SIGNER_SHA1 }}
        run: node scripts/verify-signing-env.mjs windows
      - name: Build signed Windows packages
        if: matrix.platform == 'windows'
        env:
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
        run: npm run package:win -- --config.publish.channel=latest --config.publish.releaseType=release
      - name: Build Linux AppImages
        if: matrix.platform == 'linux'
        run: npm run package:linux -- --config.publish.channel=latest --config.publish.releaseType=release
      - run: npm run verify:package -- release
      - name: Verify public production update manifest
        if: matrix.platform != 'linux'
        run: node scripts/verify-update-manifest.mjs ${{ matrix.platform }} release latest
      - name: Verify macOS signatures and notarization
        if: matrix.platform == 'mac'
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: node scripts/verify-release-signatures.mjs mac release latest release/signature-evidence-mac.json
      - name: Verify Windows Authenticode signatures
        if: matrix.platform == 'windows'
        env:
          WIN_SIGNER_SHA1: ${{ secrets.WIN_SIGNER_SHA1 }}
        run: node scripts/verify-release-signatures.mjs windows release latest release/signature-evidence-windows.json
      - name: Verify public production Linux update manifests
        if: matrix.platform == 'linux'
        run: |
          node scripts/verify-update-manifest.mjs linux release latest
          node scripts/verify-update-manifest.mjs linux-arm64 release latest
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          if-no-files-found: error
          path: |
            release/*.dmg
            release/*.zip
            release/*.exe
            release/*.AppImage
            release/*.blockmap
            release/latest*.yml
            release/signature-evidence-*.json

  publish:
    if: github.ref_type == 'tag'
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: bordeaux-*
          path: release-assets
          merge-multiple: true
      - name: Publish GitHub production release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" release-assets/* --repo "$GITHUB_REPOSITORY" --verify-tag --title "Bordeaux $GITHUB_REF_NAME" --generate-notes
