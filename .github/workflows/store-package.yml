name: Package Microsoft Store app

on:
  workflow_dispatch:
    inputs:
      identity_name:
        description: Partner Center Package/Identity/Name; repository variable is used when blank
        required: false
        type: string
      publisher:
        description: Partner Center Package/Identity/Publisher; repository variable is used when blank
        required: false
        type: string
      publisher_display_name:
        description: Partner Center publisher display name; repository variable is used when blank
        required: false
        type: string

permissions:
  contents: read

jobs:
  package:
    runs-on: windows-latest
    env:
      WINDOWS_STORE_IDENTITY_NAME: ${{ inputs.identity_name || vars.WINDOWS_STORE_IDENTITY_NAME }}
      WINDOWS_STORE_PUBLISHER: ${{ inputs.publisher || vars.WINDOWS_STORE_PUBLISHER }}
      WINDOWS_STORE_PUBLISHER_DISPLAY_NAME: ${{ inputs.publisher_display_name || vars.WINDOWS_STORE_PUBLISHER_DISPLAY_NAME }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Require the main branch
        if: github.ref != 'refs/heads/main'
        run: throw "Microsoft Store packages must be built from main; selected ref is $env:GITHUB_REF."
      - run: npm test
      - run: npm run typecheck
      - run: npm run package:win:store
      - run: npm run verify:package -- --store release
      - run: node scripts/verify-windows-store-package.mjs release
      - uses: actions/upload-artifact@v7
        with:
          name: bordeaux-microsoft-store
          if-no-files-found: error
          retention-days: 14
          path: release/*-windows-store-x64.appx
