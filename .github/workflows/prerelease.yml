name: Publish beta prerelease

on:
  workflow_dispatch:
    inputs:
      version:
        description: Checked-in beta version, such as 0.2.0-beta.1
        required: true
        type: string
      unsigned_windows:
        description: Temporarily publish unsigned Windows beta installers
        required: false
        type: boolean
        default: false
      notes:
        description: Optional prerelease notes; leave blank to generate them from commits
        required: false
        type: string

concurrency:
  group: bordeaux-beta-release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Require the main branch
        if: github.ref != 'refs/heads/main'
        run: |
          echo "Beta releases must be dispatched from main; selected ref is $GITHUB_REF."
          exit 1
      - name: Validate checked-in prerelease version
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: node scripts/verify-prerelease-version.mjs
      - name: Require a new Git tag
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          set +e
          git ls-remote --exit-code --tags origin "refs/tags/v$RELEASE_VERSION" >/dev/null
          status=$?
          set -e
          if [ "$status" -eq 0 ]; then
            echo "Tag v$RELEASE_VERSION already exists. Increment the checked-in beta version."
            exit 1
          fi
          if [ "$status" -ne 2 ]; then exit "$status"; fi

  ci:
    uses: ./.github/workflows/ci.yml

  build:
    needs: [validate, ci]
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: mac
            os: macos-15
            artifact: bordeaux-beta-macos
          - platform: windows
            os: windows-latest
            artifact: bordeaux-beta-windows
          - platform: linux
            os: ubuntu-latest
            artifact: bordeaux-beta-linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Validate checked-in prerelease version
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: node scripts/verify-prerelease-version.mjs
      - name: Require macOS signing and notarization credentials
        if: matrix.platform == 'mac'
        env:
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: node scripts/verify-signing-env.mjs mac
      - name: Build signed and notarized macOS packages
        if: matrix.platform == 'mac'
        env:
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          npm run package:mac:ci -- --config.mac.notarize=true --config.forceCodeSigning=true --config.publish.channel=beta --config.publish.releaseType=prerelease --config.dmg.sign=true
          node scripts/notarize-release-dmgs.mjs release beta
      - name: Require Windows signing credentials and approved signer
        if: matrix.platform == 'windows' && !inputs.unsigned_windows
        env:
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
          WIN_SIGNER_SHA1: ${{ secrets.WIN_SIGNER_SHA1 }}
        run: node scripts/verify-signing-env.mjs windows
      - name: Build signed Windows packages
        if: matrix.platform == 'windows' && !inputs.unsigned_windows
        env:
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
        run: npm run package:win -- --config.publish.channel=beta --config.publish.releaseType=prerelease
      - name: Build unsigned Windows beta packages
        if: matrix.platform == 'windows' && inputs.unsigned_windows
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npm run package:win -- --config.forceCodeSigning=false --config.publish.channel=beta --config.publish.releaseType=prerelease
      - name: Build Linux AppImages
        if: matrix.platform == 'linux'
        run: npm run package:linux -- --config.publish.channel=beta --config.publish.releaseType=prerelease
      - run: npm run verify:package -- release
      - name: Verify public beta update manifest
        if: matrix.platform != 'linux'
        run: node scripts/verify-update-manifest.mjs ${{ matrix.platform }} release beta
      - name: Verify macOS signatures and notarization
        if: matrix.platform == 'mac'
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: node scripts/verify-release-signatures.mjs mac release beta release/signature-evidence-mac.json
      - name: Verify Windows Authenticode signatures
        if: matrix.platform == 'windows' && !inputs.unsigned_windows
        env:
          WIN_SIGNER_SHA1: ${{ secrets.WIN_SIGNER_SHA1 }}
        run: node scripts/verify-release-signatures.mjs windows release beta release/signature-evidence-windows.json
      - name: Verify public beta Linux update manifests
        if: matrix.platform == 'linux'
        run: |
          node scripts/verify-update-manifest.mjs linux release beta
          node scripts/verify-update-manifest.mjs linux-arm64 release beta
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          if-no-files-found: error
          retention-days: 14
          path: |
            release/*.dmg
            release/*.zip
            release/*.exe
            release/*.AppImage
            release/*.blockmap
            release/beta*.yml
            release/signature-evidence-*.json

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: actions/download-artifact@v8
        with:
          pattern: bordeaux-beta-*
          path: release-assets
          merge-multiple: true
      - name: Publish GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          UNSIGNED_WINDOWS: ${{ inputs.unsigned_windows }}
          RELEASE_NOTES: ${{ inputs.notes }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          if [ "$UNSIGNED_WINDOWS" = "true" ]; then
            RELEASE_NOTES="${RELEASE_NOTES}"$'\n\n'"Windows setup and portable executables in this beta are unsigned. macOS packages are signed and notarized."
          fi
          export RELEASE_NOTES
          node scripts/publish-prerelease.mjs release-assets
